<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="Landing page" content="width=device-width, initial-scale=1.0">
    <title style="font-size: 50px;">Landing Page- QuackStore</title>
    <link rel="stylesheet" href="index.css">
     
</head>
<body>
    <header class="main-header"><main>
        <!--Logotipo y nombre-->
        <section class="logo-container">
            <img src="ducky_logo_ala_amarilla_vertical .svg.png" alt="Ducky Logo" class="logo" width= 50px height= 50px>
            <span class ="logo-text" style="position: absolute; left: 50%; transform: translateX(-50%); font-weight: bold; font-size: 1.5rem;">QuackStore</span>
        </section>

        
        <!-- Botón de Acción -->
        <section class="action-button">
            <a href="#" class="btn-shop" style="font-size: 50px;">Shop Now </a>
            

        </section>
    </header></main>

  <section class="card-container">
    <!--Bloque de Texto-->
    <span class="badge">
        <span class="star-icon">★</span>
        Experiencia de compra alegre
    </span>
    <article>
     <h1>QuackStore: <br>Tu aliado en compras <span> divertidas y seguras.</span> </h1>
       <p> Nuestra misión es hacer que cada compra sea una experiencia alegre y organizada. 
        Descubre un mundo donde la calidad se encuentra con la diversión.</p>
      <section class="button-container">
        <a href="#" class="btn-primary">Explorar la tienda</a>
        <a href="#" class="btn-secondary">
            <span class="info-icon">ⓘ</span> Saber más
        </a>
    </article>
    </section>
  </section>
   <!--Bloque de Imagen-->
    <section class="image-container">
          <img src="tienda.jpg" alt="Imagen de la tienda" class="store-image">
    </section>

    
</div>


</body>
</html>
